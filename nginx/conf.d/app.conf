# Базовый HTTP-конфиг. Для production включите HTTPS:
# скопируйте app-ssl.conf.example в app-ssl.conf, подставьте домен и выпустите сертификат.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ACME challenge для Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # После подключения HTTPS раскомментируйте редирект и удалите раздачу ниже
    # return 301 https://$host$request_uri;

    location /api/leads {
        limit_req zone=leads_zone burst=4 nodelay;
        proxy_pass http://backend:8000;
    }

    location /api/ {
        limit_req zone=api_zone burst=40 nodelay;
        proxy_pass http://backend:8000;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    location /_next/static/ {
        proxy_pass http://frontend:3000;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(?:ico|svg|png|jpg|jpeg|webp|avif|woff2|css|js)$ {
        proxy_pass http://frontend:3000;
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        proxy_pass http://frontend:3000;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
